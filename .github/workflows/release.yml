name: Release

# Every push to main is type-checked, tested, packaged for each browser store,
# and published as a GitHub release tagged v<manifest version>-build.<run number>.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build store packages
        run: pnpm build

      - name: Lint Firefox package
        run: pnpm lint:firefox

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Slyfox ${version} (build ${GITHUB_RUN_NUMBER})" \
            --generate-notes
